<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteLive – Umfragen in Echtzeit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="navbar__logo" href="index.html">Vote<span>Live</span></a>
        <div class="navbar__actions">
            <a class="btn btn--secondary btn--sm" href="moderator.html">Moderator-Login</a>
        </div>
    </nav>

    <main class="center">
        <div class="card fade-up">
            <h1 style="margin-bottom:0.4rem;">Jetzt mitmachen</h1>
            <p style="color:var(--text-muted);margin-bottom:1.8rem;">Gib den 6-stelligen Code ein, den dein Moderator anzeigt.</p>

            <div id="alertBox"></div>

            <form id="joinForm">
                <div class="form-group">
                    <label for="codeInput">Session-Code</label>
                    <input
                        id="codeInput"
                        class="code-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="000000"
                        autocomplete="off"
                        autofocus
                    >
                </div>
                <div class="form-group">
                    <label for="nameInput">Dein Name <span style="color:var(--text-muted)">(optional)</span></label>
                    <input id="nameInput" type="text" placeholder="Anonym" maxlength="40">
                </div>
                <button type="submit" class="btn btn--primary btn--full">Beitreten</button>
            </form>

            <p style="margin-top:1.5rem;font-size:0.82rem;color:var(--text-muted)">
                Du willst eine Umfrage erstellen?
                <a href="moderator.html" style="color:var(--primary)">Hier anmelden</a>
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const form      = document.getElementById('joinForm');
        const codeInput = document.getElementById('codeInput');
        const nameInput = document.getElementById('nameInput');
        const alertBox  = document.getElementById('alertBox');

        // Nur Ziffern erlauben
        codeInput.addEventListener('input', () => {
            codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (code.length !== 6) {
                showAlert(alertBox, 'Bitte einen gültigen 6-stelligen Code eingeben.', 'error');
                return;
            }

            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Suche...';

            try {
                const res  = await fetch(`/api/sessions?code=${code}`);
                const data = await res.json();
                if (!res.ok) {
                    showAlert(alertBox, data.error || 'Session nicht gefunden.', 'error');
                    return;
                }
                const name = nameInput.value.trim() || 'Anonym';
                localStorage.setItem('vl_name', name);
                window.location.href = `teilnehmer.html?id=${data.id}`;
            } catch {
                showAlert(alertBox, 'Verbindungsfehler. Bitte versuche es erneut.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Beitreten';
            }
        });
    </script>
</body>
</html>
